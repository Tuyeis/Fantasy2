<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marioneta</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0a12; overflow: hidden; font-family: "Segoe UI", sans-serif; color: #efe6d2; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .box { position: fixed; background: rgba(20,16,28,.85); border: 1px solid #6b5a3a; border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.6; }
  #help { left: 12px; top: 10px; } #mode { right: 12px; top: 10px; } #opts { left: 12px; bottom: 10px; }

  b { color: #f5c542; } label { margin-right: 12px; cursor: pointer; }

</head>
<body>
<canvas id="c"></canvas>
<div id="help" class="box"><b id="clsName">Marioneta</b> (frente, espaldas y perfil)<br><b>WASD</b> andar en 8 direcciones · <b>J</b> atacar · <b>K</b> hechizo · <b>Espacio</b> esquivar · <b>H</b> golpe<br>Sin tocar nada hace una demo.<br>Clase: <select id="clsPick"><option value="novice">Novato</option><option value="swordsman">Espadachín</option><option value="vampire">Vampiro</option><option value="dark_elf">Elfa oscura (arco)</option><option value="knight">Caballero</option><option value="wukong">Wukong</option><option value="mage">Maga</option><option value="cat">Gato</option><option value="elf">Elfa (arco)</option><option value="dark_witch">Bruja oscura</option><option disabled>── monstruos ──</option><option value="goblin">Goblin</option><option value="goblin_king">Rey goblin</option><option value="orc">Orco</option><option value="skeleton">Esqueleto</option><option value="zombie">Zombi</option><option value="dark_knight">Caballero oscuro</option><option value="succubus">Súcubo</option><option value="minotaur">Minotauro</option><option value="lich">Liche</option><option value="fire_imp">Diablillo ígneo</option><option value="void_sovereign">Soberano del Vacío</option></select></div>
<div id="mode" class="box"></div>
<div id="opts" class="box"><label><input type="checkbox" id="bones"> ver piezas</label><label><input type="checkbox" id="slow"> cámara lenta</label></div>
<script>
const PARAMS = new URLSearchParams(location.search);
// ?embed=1: bestiary card mode (no UI, side view facing left, walk / attack / idle loop in place).
const EMBED = PARAMS.get("embed") === "1";
if (EMBED) { document.documentElement.classList.add("embed"); }
// Monsters live in puppets/<key>/ like the classes; the selector below lists both.
const CLS = PARAMS.get("cls") || "novice";
document.title = "Marioneta · " + CLS; document.getElementById("clsName").textContent = "Marioneta · " + CLS;
const clsPick = document.getElementById("clsPick"); clsPick.value = CLS; clsPick.addEventListener("change", () => { location.search = "?cls=" + clsPick.value; });
clsPick.addEventListener("keydown", e => e.stopPropagation());
const BASE = CLS === "novice" ? "novice_puppet/" : "puppets/" + CLS + "/";
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), modeEl = document.getElementById("mode");
let W, H, DPR;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; }
addEventListener("resize", resize); resize();

// ------------------------------------------------------------------ assets
const rigs = {}, weapon = {}, offhand = {};
function loadImg(src) { return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.src = src; }); }
function tinted(im, filter) { const c = document.createElement("canvas"); c.width = im.width; c.height = im.height; const g = c.getContext("2d"); g.filter = filter; g.drawImage(im, 0, 0); return c; }
function silhouette(im) { const c = document.createElement("canvas"); c.width = im.width; c.height = im.height; const g = c.getContext("2d"); g.drawImage(im, 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); return c; }
let ready = false;
(async () => {
  for (const view of ["front", "back", "side"]) {
    const rig = await (await fetch(BASE + view + "/rig.json")).json();
    rig.byName = {};
    for (const p of rig.parts) { p.img = await loadImg(BASE + view + "/" + p.file); p.white = silhouette(p.img); p.dark = tinted(p.img, "brightness(0.86) saturate(0.92)"); rig.byName[p.name] = p; }
    rigs[view] = rig;
  }
  // weapon.json is optional: without it the character fights bare-handed ({type: "none"}).
  const wres = await fetch(BASE + "weapon.json");
  Object.assign(weapon, wres.ok && (wres.headers.get("content-type") || "").includes("json") ? await wres.json() : {type: "none"});
  // Optional off-hand item (a knight's shield).
  const ores = await fetch(BASE + "offhand.json");
  if (ores.ok && (ores.headers.get("content-type") || "").includes("json")) {
    Object.assign(offhand, await ores.json()); offhand.img = await loadImg(BASE + "offhand.png");
    offhand.white = silhouette(offhand.img); offhand.dark = tinted(offhand.img, "brightness(0.55) saturate(0.7)");
  }
  if (weapon.type !== "none") {
    weapon.img = await loadImg(BASE + "weapon.png"); weapon.white = silhouette(weapon.img); weapon.glow = tinted(weapon.white, "sepia(1) saturate(4) hue-rotate(5deg)");
  }
  ready = true;
})();

// ------------------------------------------------------------------ state
const keys = new Set(); let lastInput = -10, time = 0;
addEventListener("keydown", e => { keys.add(e.code); lastInput = time; if (e.code === "Space") e.preventDefault();
  if (e.code === "KeyJ") act("attack"); if (e.code === "KeyK") act("cast"); if (e.code === "Space") act("dash"); if (e.code === "KeyH") hurt(); });
addEventListener("keyup", e => keys.delete(e.code));
const SPRITE_H = 250;
// Every view gets the same neck-to-feet size (hair, hats or ears must not change the body size).
const SPRITE_BODY = 148;
function bodyScale(rig) { return SPRITE_BODY / (rig.bottom - rig.joints.neck[1]); }
const isBow = () => weapon.type === "bow";
const isStaff = () => weapon.type === "staff" || weapon.type === "trident";
const isPole = () => weapon.type === "pole";
// Magic colour of a staff's bolt per class (keys, not labels).
const BOLT_COLOR = {mage: "#74c0fc", dark_witch: "#b197fc", lich: "#8ce99a", fire_imp: "#ff922b"};
const hero = { x: 0, y: 0, view: "front", facing: 1, flip: 1, walk: 0, moving: false, action: null, t: 0, did: false, flash: 0, ghosts: [], dash: {x: 0, y: 1}, dirX: 0, dirY: 1, wAng: 0, wVel: 0, wTrail: [], lastView: "front", blade: null, bladeHist: [], bowDraw: 0 };
let arrows = [];
const target = { x: 0, y: 0, flash: 0, knock: 0, squash: 0 };
let particles = [], floaters = [], slashes = [], orbs = [], rings = [], dust = [], hitstop = 0, shake = 0, flashScreen = 0, stepTimer = 0;
function place() { hero.x = W * 0.42; hero.y = H * 0.66; target.x = W * 0.42 + Math.min(W * 0.3, 280); target.y = H * 0.66;
  if (EMBED) { hero.x = W * 0.5; hero.y = H * 0.9; target.x = -9999; } }
place();
const rnd = (a, b) => a + Math.random() * (b - a);
const ease = k => 1 - Math.pow(1 - k, 3);
function burst(x, y, color, n, speed = 260, life = .6, size = 5) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rnd(speed * .3, speed); particles.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rnd(life * .5, life), max: life, color, size: rnd(size * .5, size), grav: 500}); } }
function act(name) { if (hero.action || !ready) return; hero.action = name; hero.t = 0; hero.did = false;
  if (name === "dash") { const l = Math.hypot(hero.dirX, hero.dirY) || 1; hero.dash = {x: hero.dirX / l, y: hero.dirY / l}; } }
function hurt() { hero.flash = 1; shake = 10; floaters.push({text: "-12", x: hero.x, y: hero.y - SPRITE_H - 10, life: 1, color: "#ff6b6b", size: 30}); burst(hero.x, hero.y - SPRITE_H * .5, "#ff8787", 14); }
function hitTarget(amount, color, crit) { target.flash = 1; target.knock = 22; target.squash = 1; hitstop = crit ? .09 : .055; shake = crit ? 12 : 6;
  floaters.push({text: amount + (crit ? "!" : ""), x: target.x + rnd(-10, 10), y: target.y - 120, life: 1.1, color: crit ? "#ffd43b" : "#fff", size: crit ? 40 : 30, pop: 0}); burst(target.x - 20, target.y - 60, color, crit ? 26 : 16, 340); }
function setDirection(dx, dy) {
  if (dx === 0 && dy === 0) return;
  hero.dirX = dx; hero.dirY = dy;
  if (Math.abs(dx) > Math.abs(dy) * 0.9) { hero.view = "side"; hero.facing = dx > 0 ? 1 : -1; }
  else hero.view = dy > 0 ? "front" : "back";
}

// ------------------------------------------------------------------ poses (radians, + = clockwise on screen)
function pose() {
  const v = hero.view, P = { rootX: 0, rootY: 0, torso: 0, torsoSY: 1, head: 0, headY: 0,
    armL: 0, armR: 0, armLSY: 1, armRSY: 1, legL: {a: 0, lift: 0, sy: 1}, legR: {a: 0, lift: 0, sy: 1}, weapon: 0, farArm: 0, farLeg: 0, weaponFront: false };
  const s = Math.sin(hero.walk), c = Math.cos(hero.walk);
  if (v === "side") {
    P.weapon = isBow() ? 0.08 : -0.95;
    if (isStaff()) P.weapon = 0.1;       // head up, like a walking stick (absolute angle ~ arm + 0.1)
    if (isPole()) P.weapon = 0.95;
    if (hero.moving) {
      P.rootY = -Math.abs(c) * 7; P.torso = 0.06; P.head = -0.03 + s * 0.02;
      P.legL = {a: -s * 0.5, lift: Math.max(0, -s) * 5, sy: 1}; P.farLeg = s * 0.5;
      // The sword arm swings less than the free arm, as when carrying a weapon.
      P.armL = s * 0.36; P.farArm = -s * 0.55;
    } else { const b = Math.sin(time * 2.4); P.torsoSY = 1 + b * .015; P.headY = -b * 1.5; P.armL = 0.04 + b * .03; P.farArm = -0.04; }
  } else {
    // Seen from behind, a bow hanging straight down reaches the floor: carry it diagonally, lower limb out.
    P.weapon = isBow() ? (v === "front" ? 0.12 : -1.15) : (v === "front" ? 0.85 : -0.85);
    if (isStaff()) P.weapon = v === "front" ? 0.06 : -0.06;
    if (isPole()) P.weapon = v === "front" ? 0.55 : -0.55;
    if (hero.moving) {
      // Walking towards / away from the camera: short steps where the moving leg fore-shortens (instead of
      // marching with high knees), weight shifting over the supporting foot, arms opposite to the legs.
      const stepL = Math.max(0, s), stepR = Math.max(0, -s);
      P.rootY = -Math.abs(c) * 3.5 - 1;
      P.rootX = s * 4;
      P.legL = {a: s * 0.04, lift: stepL * 5, sy: 1 - stepL * 0.16};
      P.legR = {a: s * 0.04, lift: stepR * 5, sy: 1 - stepR * 0.16};
      P.armL = 0.05 + s * 0.08; P.armR = -0.05 + s * 0.08;
      P.armLSY = 1 - stepR * 0.14; P.armRSY = 1 - stepL * 0.14;
      P.torso = -s * 0.03; P.head = s * 0.02; P.headY = Math.abs(c) * 1;
    } else { const b = Math.sin(time * 2.4); P.torsoSY = 1 + b * .015; P.headY = -b * 1.5; P.armL = 0.04 + b * .03; P.armR = -0.04 - b * .03; P.head = Math.sin(time * 1.1) * .025; }
  }
  const t = hero.t;
  // The sword arm: front = image-left arm (character's right), back = image-right arm, side = near arm.
  const swordArm = v === "back" ? "armR" : "armL";
  const outward = v === "back" ? -1 : 1;   // + rotation lifts the image-left arm outwards
  if (hero.action === "attack" && isStaff()) {
    // Raise the staff and fire a bolt from its head at t = .3.
    const raise = ease(Math.min(1, t / .22)), rec = t > .42 ? ease(Math.min(1, (t - .42) / .3)) : 0, k2 = raise * (1 - rec);
    if (v === "side") { P.armL = -1.35 * k2 + P.armL * (1 - k2); P.weapon = (1.25 - P.armL) * k2 + 0.1 * (1 - k2); P.torso = -0.05 * k2; }
    else { const arm = v === "back" ? "armR" : "armL", out = v === "back" ? -1 : 1;
      P[arm] = 2.5 * out * k2 + P[arm] * (1 - k2); P.weapon = (-0.15 * out - P[arm]) * k2 + (v === "front" ? 0.06 : -0.06) * (1 - k2); }
  } else if (hero.action === "attack" && isPole() && v === "side") {
    // Wukong: arm forward, the pole spins twice in front of the body.
    const raise = ease(Math.min(1, t / .1)), rec = t > .55 ? ease(Math.min(1, (t - .55) / .2)) : 0, k2 = raise * (1 - rec);
    P.armL = -1.2 * k2 + P.armL * (1 - k2);
    P.weapon = 0.95 + Math.min(1, Math.max(0, (t - .08) / .45)) * Math.PI * 4 - P.armL * k2;
    P.rootX = 12 * k2; P.torso = 0.06 * k2;
  } else if (hero.action === "attack" && isBow()) {
    // Bow: raise the bow arm, the other hand pulls the string, release, recover. The bow stays upright (weapon = -arm).
    const raise = ease(Math.min(1, t / .16)), rec = t > .45 ? ease(Math.min(1, (t - .45) / .3)) : 0;
    if (v === "side") {
      P.armL = -1.45 * raise * (1 - rec);
      const pull = t < .16 ? -1.3 * raise : t < .42 ? -1.3 + 0.75 * ease((t - .16) / .26) : -0.55 + 0.4 * Math.min(1, (t - .42) / .08);
      P.farArm = pull * (1 - rec);
      P.weapon = -P.armL + 0.05;
      P.torso = -0.04 * raise * (1 - rec);
    } else if (v === "back") {
      // Archer seen from behind: the bow arm reaches forward (into the picture, so it points up on screen) and the
      // bow stands upright next to the head; the drawing hand pulls the string back behind the head.
      const k2 = raise * (1 - rec), draw = hero.bowDraw;
      P.armR = -2.15 * k2 + P.armR * (1 - k2);
      P.armRSY = 1 - 0.22 * k2;
      P.armL = -2.8 * k2 + P.armL * (1 - k2);
      P.armLSY = 1 - (0.45 + 0.12 * draw) * k2;
      P.weapon = (-0.18 - P.armR) * k2 - 1.15 * (1 - k2);
    } else {
      // Shooting towards / away from the camera (Zelda style): both arms point forward (fore-shortened), the bow
      // lies horizontal in front of the chest with the string towards the body, the arrow points along the shot.
      const bowArm = v === "back" ? "armR" : "armL", pullArm = bowArm === "armL" ? "armR" : "armL", inward = v === "back" ? 1 : -1;
      const k2 = raise * (1 - rec), draw = hero.bowDraw;
      P[bowArm] = 0.55 * inward * k2 + P[bowArm] * (1 - k2);
      // Away from the camera the arm points into the picture: stronger fore-shortening, the bow ends up at shoulder height.
      P[bowArm + "SY"] = 1 - (v === "back" ? 0.72 : 0.5) * k2;
      P[pullArm] = -0.5 * inward * k2 + P[pullArm] * (1 - k2);
      P[pullArm + "SY"] = 1 - (v === "back" ? 0.62 + 0.1 * draw : 0.58 + 0.12 * draw) * k2;
      const idleRel = v === "front" ? 0.12 : -1.15;
      P.weapon = (-Math.PI / 2 - P[bowArm]) * k2 + idleRel * (1 - k2);
    }
  } else if (hero.action === "attack") {
    let a;
    if (v === "side") {
      // Overhead chop: back-up (2.5) -> over the head (pi) -> forward-down (5.2) -> rest (2pi = hanging).
      if (t < .14) a = ease(t / .14) * 2.5;
      else if (t < .24) a = 2.5 + ease((t - .14) / .1) * 2.7;
      else a = 5.2 + ease(Math.min(1, (t - .24) / .32)) * (2 * Math.PI - 5.2);
    } else {
      // Front/back: diagonal slash across the body.
      if (t < .14) a = ease(t / .14) * 2.5;
      else if (t < .24) a = 2.5 - ease((t - .14) / .1) * 3.6;
      else a = -1.1 + ease(Math.min(1, (t - .24) / .32)) * 1.1;
    }
    // Wrist whip: during the strike the blade leads the hand, then settles.
    const whip = t > .14 && t < .3 ? Math.sin((t - .14) / .16 * Math.PI) * 0.75 : 0;
    // Blade relative to the arm: in line during wind-up, leading (whip) at impact, back to guard while recovering.
    const recover = t > .24 ? ease(Math.min(1, (t - .24) / .32)) : 0;
    if (v === "side") { P.armL = a; P.weapon = (t < .14 ? 0.3 : 0.5 * (1 - recover) - 0.95 * recover) + whip; P.torso = t < .14 ? -0.1 : t < .32 ? 0.16 : 0.16 * (1 - Math.min(1, (t - .32) / .25)); P.rootX = t < .14 ? -10 : t < .32 ? 34 : 34 * (1 - Math.min(1, (t - .32) / .25)); P.legL = {a: -0.35, lift: 0, sy: 1}; P.farLeg = 0.3; }
    else if (v === "back") {
      // Seen from behind the enemy is UP the screen: rising diagonal slash. Wind-up low at the side, sweep behind
      // the body and finish with the blade above the head; then bring it back down to the guard.
      let b;
      if (t < .14) b = -0.55 * ease(t / .14);
      else if (t < .26) b = -0.55 + ease((t - .14) / .12) * 3.25;
      else b = 2.7 * (1 - ease(Math.min(1, (t - .3) / .2)) * (t > .3 ? 1 : 0));
      P.armR = b;
      P.weapon = t < .14 ? -0.6 : (t < .26 ? whip : -0.85 * recover);
      P.torso = t < .14 ? 0.05 : -0.08 * (1 - recover);
      P.rootY = t < .14 ? 3 : -6 * (1 - recover);
    }
    else { P[swordArm] = a * outward; P.weapon = ((t < .14 ? 0.1 : 0.7) - whip) * outward; P.torso = (t < .14 ? -0.05 : 0.08) * outward; P.rootY = t < .14 ? -4 : 6 * (1 - Math.min(1, (t - .24) / .3)); P.weaponFront = true; }
  } else if (hero.action === "cast") {
    const k = ease(Math.min(1, t / .3)), rel = t > .9 ? Math.min(1, (t - .9) / .15) : 0;
    if (v === "side") { P.armL = -2.2 * k + 1.6 * rel; P.farArm = -2.0 * k + 1.4 * rel; P.head = -0.08; }
    else { P.armL = 2.3 * k - 1.5 * rel; P.armR = -2.3 * k + 1.5 * rel; }
    P.rootY = -10 * k + Math.sin(time * 8) * 1.5;
  } else if (hero.action === "dash") {
    P.torso = v === "side" ? 0.3 : 0; P.rootY = -6;
    if (v === "side") { P.armL = 0.9; P.farArm = 1.0; P.legL = {a: 0.5, lift: 4, sy: 1}; P.farLeg = -0.4; }
    else { P.armL = 0.5; P.armR = -0.5; P.legL = {a: 0.1, lift: 10, sy: .9}; P.legR = {a: -0.1, lift: 4, sy: .95}; }
  }
  // Poses are authored for side art facing RIGHT (+x forward); mirror the signs if the art faces left.
  if (v === "side" && sideArtFacing() === -1) {
    for (const key of ["torso", "head", "armL", "farArm", "farLeg", "weapon", "rootX"]) P[key] = -P[key];
    P.legL = {...P.legL, a: -P.legL.a};
  }
  // Arms drawn open (A-pose sheets) are brought back towards hanging straight; weapon angles stay absolute.
  const rest = restCorrection(rigs[v], v);
  if (v === "side") { P.armL += rest.l; P.farArm += rest.l; P.weapon -= rest.l; }
  else { P.armL += rest.l; P.armR += rest.r; P.weapon -= (v === "back" ? rest.r : rest.l); }
  // Tail (or scarf): lazy sway, livelier when walking, a flick on attacks.
  P.tail = Math.sin(time * 2.2) * 0.1 + (hero.moving ? Math.sin(hero.walk + 1.2) * 0.22 : 0) + (hero.action === "attack" ? Math.sin(Math.min(1, hero.t / .5) * Math.PI) * 0.35 : 0);
  return P;
}
function restCorrection(rig, v) {
  if (!rig) return {l: 0, r: 0};
  if (!rig.rest) {
    const J = rig.joints, keep = v === "side" ? 0.1 : 0.25;
    const ang = (sh, hd) => { if (!J[sh] || !J[hd]) return 0; const a = Math.atan2(J[hd][0] - J[sh][0], J[hd][1] - J[sh][1]);
      return Math.abs(a) <= keep ? 0 : a - Math.sign(a) * keep; };
    rig.rest = {l: ang("shoulder_l", "hand_l"), r: ang("shoulder_r", "hand_r")};
  }
  return rig.rest;
}
function sideArtFacing() { return rigs.side && rigs.side.facing ? rigs.side.facing : 1; }

// ------------------------------------------------------------------ drawing
function drawPartImg(p, useDark) { ctx.drawImage(useDark ? p.dark : p.img, p.x, p.y);
  if (hero.flash > 0) { ctx.globalAlpha = hero.flash; ctx.drawImage(p.white, p.x, p.y); ctx.globalAlpha = 1; }
  if (document.getElementById("bones").checked) { ctx.strokeStyle = useDark ? "#0a0" : "#0f0"; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.img.width, p.img.height); ctx.fillStyle = "#f0f"; ctx.fillRect(p.pivotX - 4, p.pivotY - 4, 8, 8); } }
function withRot(p, angle, sx, sy, fn) { ctx.save(); ctx.translate(p.pivotX, p.pivotY); ctx.rotate(angle); ctx.scale(sx, sy); ctx.translate(-p.pivotX, -p.pivotY); fn(); ctx.restore(); }
// The weapon has its own physics: its absolute angle (hero.wAng) follows the hand through a spring,
// so it lags, overshoots and whips instead of looking glued to the arm.
function drawWeaponAt(rig, handJoint, armPart, armAngle, armSY = 1) {
  const hand = rig.joints[handJoint]; if (!hand || !weapon.img) return;
  const ws = 1.2;
  // Follow the arm exactly (rotation AND its fore-shortening scale) so the fist never slides on the handle.
  const place = (angle) => { ctx.translate(armPart.pivotX, armPart.pivotY); ctx.rotate(armAngle); ctx.scale(1, armSY); ctx.translate(hand[0] - armPart.pivotX, hand[1] - armPart.pivotY);
    ctx.scale(1, 1 / armSY); ctx.rotate(angle - armAngle); ctx.scale(ws, ws); ctx.translate(-weapon.grip[0], -weapon.grip[1]); };
  ctx.save(); place(hero.wAng);
  if (isBow()) {
    // The string must face the archer: back of the body in side view, towards the body centre in front/back views.
    const desired = hero.view === "side" ? -sideArtFacing() : (hero.view === "front" ? 1 : -1);
    if (weapon.stringSide !== desired) { ctx.translate(weapon.grip[0], 0); ctx.scale(-1, 1); ctx.translate(-weapon.grip[0], 0); }
  }
